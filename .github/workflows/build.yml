on:
  push:
    paths:
      - 'laravel-test-runner/Dockerfile'
    branches: [main]
  workflow_dispatch:

name: Build Laravel Test Runner

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: laravel-test-runner
          push: true
          tags: ghcr.io/chengkangzai/laravel-test-runner:8.4
          cache-from: type=gha
          cache-to: type=gha,mode=max

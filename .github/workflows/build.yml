on:
  push:
    paths:
      - 'laravel-test-runner/Dockerfile'
      - '.github/workflows/build.yml'
    branches: [master, main]
  workflow_dispatch:

name: Build Laravel Test Runner

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: laravel-test-runner
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: PHP_VERSION=${{ matrix.php }}
          tags: ghcr.io/chengkangzai/laravel-test-runner:${{ matrix.php }}
          # Scope the cache per version, or the two matrix legs overwrite each other's layers.
          cache-from: type=gha,scope=php-${{ matrix.php }}
          cache-to: type=gha,mode=max,scope=php-${{ matrix.php }}
